!
! NetAdapt AI - Cisco Compliant Configuration
!

hostname NetAdapt-Router-01
ip domain-name netadapt.local

!
! AAA
!
aaa new-model
aaa authentication login default local

!
! Local user
!
username admin secret 9 $9$NETADAPT$DEMOHASHVALUE

!
! Password protection
!
service password-encryption

!
! SSH
!
ip ssh time-out 60
ip ssh authentication-retries 3

!
! VTY configuration
!
line vty 0 4
 login authentication default
 transport input ssh
 access-class 10 in
 exec-timeout 10 0

!
! VTY access control
!
access-list 10 permit 10.10.10.0 0.0.0.255

!
! Disable DHCP service
!
no service dhcp

!
! Logging
!
logging enable
logging buffered 64000

!
! NTP authentication
!
ntp authenticate

!
end