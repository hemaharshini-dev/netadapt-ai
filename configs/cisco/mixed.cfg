!
! NetAdapt AI - Mixed Cisco Configuration
!

hostname NetAdapt-Test-Router
ip domain-name netadapt.local

!
! AAA
!
aaa new-model
aaa authentication login default local

!
! Local user - compliant
!
username admin secret 9 $9$NETADAPT$DEMOHASHVALUE

!
! Password encryption - compliant
!
service password-encryption

!
! SSH - partially compliant
!
ip ssh time-out 45
ip ssh authentication-retries 5

!
! VTY - partially compliant
!
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 5 0

!
! Notice:
! access-class is intentionally missing
!

!
! DHCP - compliant
!
no service dhcp

!
! Logging - partially compliant
!
logging buffered 32000

!
! Notice:
! logging enable is intentionally missing
!

!
! NTP authentication - compliant
!
ntp authenticate

!
end